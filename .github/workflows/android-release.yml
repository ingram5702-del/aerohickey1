name: Android Release

on:
  workflow_dispatch:
    inputs:
      deploy_to_play:
        description: Upload the generated AAB to Google Play after build
        required: true
        type: boolean
        default: false
      track:
        description: Google Play track for deployment
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      release_status:
        description: Google Play release status
        required: true
        type: choice
        options:
          - completed
          - draft
          - inProgress
        default: completed
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GOOGLE_PLAY_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it in GitHub repository Secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-hockey-release-aab-v${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  upload-google-play:
    name: Upload to Google Play
    needs: build-aab
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_to_play == true) || (github.event_name == 'push' && vars.GOOGLE_PLAY_DEPLOY_ENABLED == 'true') }}

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: neon-hockey-release-aab-v${{ github.run_number }}
          path: release

      - name: Validate Play Console secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is missing. Add the Google Play service account JSON in GitHub repository Secrets."
            exit 1
          fi

      - name: Upload bundle to Google Play (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aerogo.apps
          releaseFiles: release/*.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.release_status }}

      - name: Upload bundle to Google Play (automatic)
        if: ${{ github.event_name == 'push' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aerogo.apps
          releaseFiles: release/*.aab
          track: ${{ vars.GOOGLE_PLAY_TRACK || 'internal' }}
          status: ${{ vars.GOOGLE_PLAY_RELEASE_STATUS || 'completed' }}
